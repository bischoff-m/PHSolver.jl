            mass: C6
            x0: Vq_S
        connections:
          - from: d
            to: q
            weight: omega0 * C6 - exp_b(d.x, q.x, P_exp_dgu6)
    connections:
      - from: I
        to: V
        weight: -1

  - id: ZipLoad7
    systems:
      - id: d
        dissipation: zip_g(d.x, q.x, YP_medium, IP_medium, PP_medium)
        mass: C7
        x0: Vd_S
      - id: q
        dissipation: zip_g(d.x, q.x, YP_medium, IP_medium, PP_medium)
        mass: C7
        x0: Vq_S
    connections:
      - from: d
