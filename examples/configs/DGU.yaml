# yaml-language-server: $schema=../../schemas/system.schema.json

# CIGRE medium-voltage Feeder 1 from Figure 5.1 and Scenario A in Section 5.4.2.
# This is the scalar dq plant at the base operating point. The controller laws and
# plug-and-play events are documented as representation gaps in the accompanying notes.
id: DGU_example

definitions:
  - V0 = 20000
  - omega0 = 314.1592653589793
  - Vd_S = 21000
  - Vq_S = 0
  - I_d0 = 0
  - I_q0 = 0
  - connected = 1
  - disconnected = 0
  - event_slope = 20
  - voltage_slope = 0.01
  - sigmoid(x, slope) = 0.5 * (1 + tanh(slope * x / 2))
  - event_enabled(t, start, stop) = connected + (disconnected - connected) * (sigmoid(t - start, event_slope) - sigmoid(t - stop, event_slope))
  - smooth_select(value, threshold, above, below) = below + sigmoid(value - threshold, voltage_slope) * (above - below)
  - dgu4_enabled(t) = event_enabled(t, 5, 15)
  - dgu5_enabled(t) = event_enabled(t, 20, 30)
  - line17_enabled(t) = event_enabled(t, 10, 25)
  - line19_enabled(t) = event_enabled(t, 10, 25)
  - R_dgu = 0.1
  - L_dgu = 0.0018
  - C_dgu = 25e-6
  - R_zero = 0
  - R_line_per_km = 0.343
  - L_line_per_km = 0.000875
  - C_line_per_km = 151.2e-9

  # Line parameters from Table 5.1, multiplied by the Figure 5.1 lengths.
  - line12_length = 2.8
  - line13_length = 4.4
  - line14_length = 0.6
  - line15_length = 0.6
  - line16_length = 1.3
  - line17_length = 0.5
  - line18_length = 0.3
  - line19_length = 1.5
  - line20_length = 0.8
  - line21_length = 0.3
  - line22_length = 1.7
  - line23_length = 0.2
  - R12 = R_line_per_km * line12_length
  - L12 = L_line_per_km * line12_length
  - R13 = R_line_per_km * line13_length
  - L13 = L_line_per_km * line13_length
  - R14 = R_line_per_km * line14_length
  - L14 = L_line_per_km * line14_length
  - R15 = R_line_per_km * line15_length
  - L15 = L_line_per_km * line15_length
  - R16 = R_line_per_km * line16_length
  - L16 = L_line_per_km * line16_length
  - R17 = R_line_per_km * line17_length
  - L17 = L_line_per_km * line17_length
  - R18 = R_line_per_km * line18_length
  - L18 = L_line_per_km * line18_length
  - R19 = R_line_per_km * line19_length
  - L19 = L_line_per_km * line19_length
  - R20 = R_line_per_km * line20_length
  - L20 = L_line_per_km * line20_length
  - R21 = R_line_per_km * line21_length
  - L21 = L_line_per_km * line21_length
  - R22 = R_line_per_km * line22_length
  - L22 = L_line_per_km * line22_length
  - R23 = R_line_per_km * line23_length
  - L23 = L_line_per_km * line23_length

  # Node capacitances include the DGU filter capacitor and half of every incident line capacitor.
  - C1 = C_dgu + C_line_per_km * (line12_length + line13_length) * 0.5
  - C2 = C_dgu + C_line_per_km * (line12_length + line14_length + line18_length) * 0.5
  - C3 = C_dgu + C_line_per_km * (line15_length + line16_length + line20_length) * 0.5
  - C4 = C_dgu + C_line_per_km * (line14_length + line15_length + line17_length + line19_length) * 0.5
  - C5 = C_dgu + C_line_per_km * (line16_length + line19_length + line20_length + line21_length + line22_length + line23_length) * 0.5
  - C6 = C_dgu + C_line_per_km * line23_length * 0.5
  - C7 = C_line_per_km * line13_length * 0.5
  - C8 = C_line_per_km * line17_length * 0.5
  - C9 = C_line_per_km * line18_length * 0.5
  - C10 = C_line_per_km * line21_length * 0.5
  - C11 = C_line_per_km * line22_length * 0.5

  # ZIP load values from Table 5.3, in SI units.
  - YP1 = 75e-6
  - IP1 = 0.3
  - PP1 = 6000
  - YP2 = 97.5e-6
  - IP2 = 0.39
  - PP2 = 7800
  - YP_medium = 51.96e-6
  - IP_medium = 0.208
  - PP_medium = 4157
  - YP8 = 58.48e-6
  - IP8 = 0.234
  - PP8 = 4679
  - Vmag(vd, vq) = sqrt(vd^2 + vq^2)
  - Vsafe(vd, vq) = max(Vmag(vd, vq), 1e-9)
  - V_threshold_fraction = 0.7
  - V_threshold = V_threshold_fraction * V0
  - zip_g(vd, vq, yp, ip, pp) = smooth_select(Vmag(vd, vq), V_threshold, yp + ip / Vsafe(vd, vq) + pp / Vsafe(vd, vq)^2, yp + ip / V_threshold + pp / V_threshold^2)
  - zip_b(vd, vq, yq, iq, pq) = smooth_select(Vmag(vd, vq), V_threshold, yq + iq / Vsafe(vd, vq) + pq / Vsafe(vd, vq)^2, yq + iq / V_threshold + pq / V_threshold^2)

  # Exponential loads use nP = nQ = 1.5 from Table 5.4.
  - exp_load_exponent = 1.5
  - exp_g(vd, vq, p0) = smooth_select(Vmag(vd, vq), V_threshold, p0 / (V0^exp_load_exponent * Vsafe(vd, vq)^0.5), p0 * V_threshold_fraction^0.5 / V0^2)
  - exp_b(vd, vq, p0) = smooth_select(Vmag(vd, vq), V_threshold, p0 / (V0^exp_load_exponent * Vsafe(vd, vq)^0.5), p0 * V_threshold_fraction^0.5 / V0^2)
  - P_exp_dgu5 = 90500
  - P_exp_dgu6 = 135750
  - P_exp_load9 = 46800
  - P_exp_load10 = 50900
  - P_exp_load11 = 76350

signals:
  dgu1.I.d: Vd_S
  dgu1.I.q: Vq_S
  dgu2.I.d: Vd_S
  dgu2.I.q: Vq_S
  dgu3.I.d: Vd_S
  dgu3.I.q: Vq_S
  dgu4.I.d: Vd_S
  dgu4.I.q: Vq_S
  dgu5.I.d: Vd_S
  dgu5.I.q: Vq_S
  dgu6.I.d: Vd_S
  dgu6.I.q: Vq_S

systems:
  - id: dgu1
    systems:
      - id: I
        systems:
          - id: d
            dissipation: R_dgu
            mass: L_dgu
            x0: 161.07
          - id: q
            dissipation: R_dgu
            mass: L_dgu
            x0: I_q0
        connections:
          - from: d
            to: q
            weight: omega0 * L_dgu
      - id: V
        systems:
          - id: d
            dissipation: zip_g(d.x, q.x, YP1, IP1, PP1)
            mass: C1
            x0: Vd_S
          - id: q
            dissipation: zip_g(d.x, q.x, YP1, IP1, PP1)
            mass: C1
            x0: Vq_S
        connections:
          - from: d
            to: q
            weight: omega0 * C1 - zip_b(d.x, q.x, YP1, IP1, PP1)
    connections:
      - from: I
        to: V
        weight: -1

  - id: dgu2
    systems:
      - id: I
        systems:
          - id: d
            dissipation: R_dgu
            mass: L_dgu
            x0: 161.07
          - id: q
            dissipation: R_dgu
            mass: L_dgu
            x0: I_q0
        connections:
          - from: d
            to: q
            weight: omega0 * L_dgu
      - id: V
        systems:
          - id: d
            dissipation: zip_g(d.x, q.x, YP2, IP2, PP2)
            mass: C2
            x0: Vd_S
          - id: q
            dissipation: zip_g(d.x, q.x, YP2, IP2, PP2)
            mass: C2
            x0: Vq_S
        connections:
          - from: d
            to: q
            weight: omega0 * C2 - zip_b(d.x, q.x, YP2, IP2, PP2)
    connections:
      - from: I
        to: V
        weight: -1

  - id: dgu3
    systems:
      - id: I
        systems:
          - id: d
            dissipation: R_dgu
            mass: L_dgu
            x0: 160
          - id: q
            dissipation: R_dgu
            mass: L_dgu
            x0: -3
        connections:
          - from: d
            to: q
            weight: omega0 * L_dgu
      - id: V
        systems:
          - id: d
            dissipation: R_zero
            mass: C3
            x0: Vd_S
          - id: q
            dissipation: R_zero
            mass: C3
            x0: Vq_S
        connections:
          - from: d
            to: q
            weight: omega0 * C3
    connections:
      - from: I
        to: V
        weight: -1

  - id: dgu4
