connections:
  # Orientations follow the drawing: first endpoint -> second endpoint.
  - from: dgu1.V
    to: Line12
    weight: -1
  - from: dgu2.V
    to: Line12
    weight: 1
  - from: dgu1.V
    to: Line13
    weight: -1
  - from: ZipLoad7
    to: Line13
    weight: 1
  - from: dgu2.V
    to: Line14
    weight: -1
  - from: dgu4.V
    to: Line14
    weight: dgu4_enabled(t)
  - from: dgu4.V
    to: Line15
    weight: -1 * dgu4_enabled(t)
  - from: dgu3.V
    to: Line15
    weight: 1
  - from: dgu3.V
    to: Line16
    weight: -1
  - from: dgu5.V
    to: Line16
    weight: dgu5_enabled(t)
  - from: dgu4.V
    to: Line17
    weight: -1 * dgu4_enabled(t) * line17_enabled(t)
  - from: ZipLoad8
    to: Line17
    weight: line17_enabled(t)
  - from: dgu2.V
    to: Line18
    weight: -1
  - from: ExpLoad9
    to: Line18
    weight: 1
  - from: dgu4.V
    to: Line19
    weight: -1 * dgu4_enabled(t) * line19_enabled(t)
  - from: dgu5.V
    to: Line19
    weight: dgu5_enabled(t) * line19_enabled(t)
  - from: dgu3.V
    to: Line20
    weight: -1
  - from: dgu5.V
    to: Line20
    weight: dgu5_enabled(t)
  - from: dgu5.V
    to: Line21
    weight: -1 * dgu5_enabled(t)
  - from: ExpLoad10
    to: Line21
    weight: dgu5_enabled(t)
  - from: dgu5.V
